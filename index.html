<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncWave: Protocol Simulator</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        darkbg: '#0b0c10',     // Deep space black
                        panelbg: '#1f2833',    // Dark slate
                        accent: '#66fcf1',     // Neon cyan
                        client: '#45a29e',     // Muted teal
                        server: '#ff652f',     // Vibrant orange
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 15px rgba(102, 252, 241, 0.4)',
                        'neon-orange': '0 0 15px rgba(255, 101, 47, 0.4)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-200 h-screen overflow-hidden font-sans">
    <div id="app" class="flex flex-col h-full p-4 gap-4">
        <!-- Header -->
        <header class="flex justify-between items-center bg-panelbg p-5 rounded-2xl shadow-neon-cyan border border-accent/20">
            <h1 class="text-3xl font-bold tracking-wide text-accent flex items-center">
                <i class="fa-solid fa-wave-square mr-3"></i> 
                SyncWave
                <span class="text-lg text-slate-400 font-normal ml-3 border-l border-slate-600 pl-3">Protocol Simulator</span>
            </h1>
            <div class="text-sm font-mono text-accent/70 bg-darkbg px-4 py-1 rounded-full border border-accent/30">
                <i class="fa-solid fa-microchip mr-1"></i> AI-Assisted
            </div>
        </header>

        <main class="flex flex-1 gap-5 overflow-hidden flex-col md:flex-row">
            
            <!-- Left Panel: Activity Panel -->
            <div class="w-full md:w-1/3 bg-panelbg rounded-2xl shadow-lg border border-slate-700/50 flex flex-col overflow-hidden relative">
                <div class="p-5 border-b border-slate-700/50 bg-darkbg/30">
                    <h2 class="text-xl font-semibold text-white tracking-wide"><i class="fa-solid fa-gamepad mr-2 text-accent"></i> User Action</h2>
                </div>
                
                <div class="p-4 flex gap-3 border-b border-slate-700/50">
                    <button @click="setActivity('browsing')" :class="['flex-1 py-2.5 rounded-xl font-medium transition-all duration-300', activity === 'browsing' ? 'bg-accent text-darkbg shadow-neon-cyan scale-105' : 'bg-darkbg text-slate-400 hover:text-white']">
                        <i class="fa-solid fa-globe mr-1"></i> Web
                    </button>
                    <button @click="setActivity('mail')" :class="['flex-1 py-2.5 rounded-xl font-medium transition-all duration-300', activity === 'mail' ? 'bg-accent text-darkbg shadow-neon-cyan scale-105' : 'bg-darkbg text-slate-400 hover:text-white']">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Mail
                    </button>
                    <button @click="setActivity('streaming')" :class="['flex-1 py-2.5 rounded-xl font-medium transition-all duration-300', activity === 'streaming' ? 'bg-accent text-darkbg shadow-neon-cyan scale-105' : 'bg-darkbg text-slate-400 hover:text-white']">
                        <i class="fa-solid fa-film mr-1"></i> Stream
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-5">
                    
                    <!-- Browsing UI -->
                    <div v-if="activity === 'browsing'" class="space-y-4 animate-fade-in">
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-400 tracking-wider uppercase">Website URL</label>
                            <input type="text" v-model="inputs.url" class="w-full bg-darkbg border border-slate-600 rounded-xl p-3.5 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all font-mono" placeholder="https://example.com">
                        </div>
                        <button @click="startSimulation" :disabled="isRunning" class="w-full py-3.5 bg-accent text-darkbg rounded-xl font-bold shadow-neon-cyan hover:scale-[1.02] disabled:opacity-50 disabled:hover:scale-100 transition-all text-lg">
                            <i class="fa-solid fa-bolt mr-2"></i> Launch Request
                        </button>
                    </div>

                    <!-- Mail UI -->
                    <div v-if="activity === 'mail'" class="space-y-4 animate-fade-in">
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-400 tracking-wider uppercase">Recipient (To)</label>
                            <input type="email" v-model="inputs.to" class="w-full bg-darkbg border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all font-mono" placeholder="user@domain.com">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-400 tracking-wider uppercase">Subject</label>
                            <input type="text" v-model="inputs.subject" class="w-full bg-darkbg border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-400 tracking-wider uppercase">Message Body</label>
                            <textarea v-model="inputs.body" class="w-full bg-darkbg border border-slate-600 rounded-xl p-3 text-white h-24 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all"></textarea>
                        </div>
                        <button @click="startSimulation" :disabled="isRunning" class="w-full py-3.5 bg-accent text-darkbg rounded-xl font-bold shadow-neon-cyan hover:scale-[1.02] disabled:opacity-50 disabled:hover:scale-100 transition-all text-lg">
                            <i class="fa-solid fa-paper-plane mr-2"></i> Dispatch Mail
                        </button>
                    </div>

                    <!-- Streaming UI -->
                    <div v-if="activity === 'streaming'" class="space-y-4 animate-fade-in">
                        <div class="space-y-2">
                            <label class="text-sm font-semibold text-slate-400 tracking-wider uppercase">Stream Quality</label>
                            <select v-model="inputs.quality" class="w-full bg-darkbg border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all font-mono">
                                <option value="1080p">1080p [High Definition]</option>
                                <option value="720p">720p [Standard HD]</option>
                                <option value="480p">480p [Standard Def]</option>
                            </select>
                        </div>
                        <div class="aspect-video bg-darkbg rounded-xl border-2 border-slate-700/50 flex items-center justify-center relative overflow-hidden group">
                            <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                            <button v-if="!isRunning && !isFinished" @click="startSimulation" class="w-16 h-16 bg-accent rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-neon-cyan z-10 text-darkbg">
                                <i class="fa-solid fa-play text-2xl ml-1"></i>
                            </button>
                            <div v-if="isRunning" class="text-accent animate-pulse flex flex-col items-center z-10">
                                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3"></i>
                                <span class="font-mono tracking-widest uppercase">Buffering...</span>
                            </div>
                            <div v-if="isFinished" class="text-client flex flex-col items-center z-10">
                                <i class="fa-solid fa-check-circle text-5xl mb-3"></i>
                                <span class="font-mono tracking-widest uppercase">Playing {{inputs.quality}}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Activity Log -->
                <div class="h-1/3 bg-darkbg border-t border-slate-700/50 p-4 flex flex-col">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center"><i class="fa-solid fa-terminal mr-2"></i> System Log</h3>
                    <div class="flex-1 overflow-y-auto space-y-2 font-mono text-[13px] text-slate-300" ref="logContainer">
                        <div v-for="(log, idx) in logs" :key="idx" class="border-l-2 pl-3 py-1" :class="log.type === 'info' ? 'border-accent bg-accent/5' : 'border-client bg-client/5'">
                            <span class="text-slate-500 mr-2">[{{log.time}}]</span> <span v-html="log.msg"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Protocol Visualization -->
            <div class="w-full md:w-2/3 bg-panelbg rounded-2xl shadow-lg border border-slate-700/50 flex flex-col relative overflow-hidden">
                <div class="p-4 border-b border-slate-700/50 bg-darkbg/30 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-white tracking-wide"><i class="fa-solid fa-network-wired mr-2 text-accent"></i> Live Traffic</h2>
                    
                    <!-- Playback Controls -->
                    <div class="flex items-center gap-1.5 bg-darkbg p-1.5 rounded-xl border border-slate-700/50 shadow-inner">
                        <button @click="stepBackward" :disabled="currentStepIndex <= 0" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-accent hover:bg-slate-800 disabled:opacity-20 transition-all" title="Step Backward">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button @click="togglePause" :disabled="!isStarted" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-accent hover:bg-slate-800 disabled:opacity-20 transition-all" title="Play/Pause">
                            <i :class="isPaused ? 'fa-solid fa-play text-accent' : 'fa-solid fa-pause'"></i>
                        </button>
                        <button @click="stepForward" :disabled="currentStepIndex >= totalSteps - 1 || !isStarted" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-accent hover:bg-slate-800 disabled:opacity-20 transition-all" title="Step Forward">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <div class="w-px h-6 bg-slate-700 mx-1"></div>
                        <button @click="replay" :disabled="!isStarted" class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-accent hover:bg-slate-800 disabled:opacity-20 transition-all" title="Restart">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>
                </div>

                <div class="flex-1 relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800/20 via-darkbg to-darkbg overflow-hidden flex flex-col p-6">
                    
                    <!-- Topology Headers -->
                    <div class="flex justify-between items-center mb-10 px-12 text-lg font-bold">
                        <!-- Client Node -->
                        <div class="flex flex-col items-center gap-3 relative z-10">
                            <div class="w-16 h-16 bg-darkbg rounded-2xl border-2 border-client flex items-center justify-center shadow-neon-cyan rotate-3 hover:rotate-0 transition-transform">
                                <i class="fa-solid fa-laptop text-client text-2xl"></i>
                            </div>
                            <span class="text-client font-mono tracking-widest uppercase text-sm">Local Host</span>
                        </div>
                        
                        <!-- Connecting Path -->
                        <div class="flex-1 relative h-px bg-slate-700/50 mx-8">
                            <div class="absolute inset-0 bg-gradient-to-r from-client/20 via-accent/50 to-server/20 h-[2px]"></div>
                        </div>

                        <!-- Server Node -->
                        <div class="flex flex-col items-center gap-3 relative z-10">
                            <div class="w-16 h-16 bg-darkbg rounded-2xl border-2 border-server flex items-center justify-center shadow-neon-orange -rotate-3 hover:rotate-0 transition-transform">
                                <i class="fa-solid fa-server text-server text-2xl"></i>
                            </div>
                            <span class="text-server font-mono tracking-widest uppercase text-sm">Remote</span>
                        </div>
                    </div>

                    <!-- Sequence Flow Container -->
                    <div class="flex-1 overflow-y-auto pr-4 space-y-8 relative pb-12" id="sequence-container">
                        <!-- Connecting Line (Vertical drop lines) -->
                        <div class="absolute top-0 bottom-0 left-[4.5rem] w-px bg-gradient-to-b from-client/40 to-transparent hidden md:block border-l border-dashed border-client/30"></div>
                        <div class="absolute top-0 bottom-0 right-[4.5rem] w-px bg-gradient-to-b from-server/40 to-transparent hidden md:block border-r border-dashed border-server/30"></div>

                        <!-- Initial state text -->
                        <div v-if="!isStarted" class="h-full flex items-center justify-center">
                            <div class="text-center text-slate-500/70 border-2 border-dashed border-slate-600/30 rounded-3xl p-10 backdrop-blur-sm">
                                <i class="fa-solid fa-satellite-dish text-4xl mb-4 opacity-50"></i>
                                <p class="font-mono text-sm tracking-widest uppercase">Awaiting Transmission...</p>
                            </div>
                        </div>

                        <!-- Rendered Steps -->
                        <div v-for="(step, index) in visibleSteps" :key="index" class="relative group">
                            
                            <!-- Protocol Badge -->
                            <div class="absolute top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2 bg-darkbg border border-slate-600 rounded-full px-3 py-1 text-[10px] text-slate-400 tracking-widest uppercase font-bold z-0 shadow-lg">
                                {{step.protocol}}
                            </div>

                            <!-- Message Wrapper -->
                            <div class="flex items-center w-full" :class="step.dir === 'c2s' ? 'justify-start' : 'justify-end'">
                                
                                <div class="message-card relative max-w-[75%] rounded-xl p-4 shadow-xl border backdrop-blur-md"
                                     :class="[
                                         step.dir === 'c2s' ? 'bg-client/10 border-client/30 ml-6 md:ml-16' : 'bg-server/10 border-server/30 mr-6 md:mr-16',
                                         index === currentStepIndex ? 'ring-2 ring-accent ring-offset-4 ring-offset-darkbg shadow-neon-cyan z-10 scale-[1.03] transition-all' : 'opacity-70 scale-100 transition-all'
                                     ]">
                                     
                                     <!-- Direction Arrow (CSS decorative) -->
                                     <div class="absolute top-1/2 -translate-y-1/2 w-8 md:w-16 h-[2px] bg-gradient-to-r"
                                          :class="step.dir === 'c2s' ? 'left-full from-client/50 to-transparent' : 'right-full from-transparent to-server/50'">
                                          <div class="absolute top-1/2 -translate-y-1/2 border-4 border-transparent"
                                               :class="step.dir === 'c2s' ? 'right-0 border-l-client' : 'left-0 border-r-server'"></div>
                                     </div>

                                    <div class="font-mono text-[13px] leading-relaxed whitespace-pre-wrap break-all text-slate-300" v-html="highlightMessage(step.msg, step.highlight)"></div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
